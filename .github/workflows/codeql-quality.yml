# Maintainability/reliability sweep over the default branch. Kept out of
# codeql.yml so pull requests keep the fast default suite, and uploaded under
# its own analysis category so it never overwrites the security scan results.
name: CodeQL Quality

on:
  schedule:
    # Daily, off-peak UTC. Public repositories lose the schedule after 60 days
    # without activity; push a commit or re-enable it if the runs stop.
    - cron: '37 3 * * *'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'c-cpp' && 'ubuntu-22.04') || 'ubuntu-latest' }}
    timeout-minutes: ${{ 360 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: autobuild
        - language: java
          build-mode: none
        - language: go
          build-mode: manual
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Java for native build
      if: matrix.language == 'go'
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v7
      with:
        go-version-file: go/go.mod
        cache-dependency-path: go/go.sum

    - name: Install native dependencies
      if: matrix.language == 'go'
      run: sudo apt-get update && sudo apt-get install -y uuid-dev

    # The Go bridge needs headers and libtsfile under cpp/target/build.
    - name: Build native library for Go
      if: matrix.language == 'go'
      run: ./mvnw -P with-cpp -Dbuild.test=OFF -DskipTests -Dspotless.skip=true package

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.2
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-quality-config.yml
        # Superset of the default suite: also runs maintainability/reliability queries.
        queries: security-and-quality

    - name: Build Go for CodeQL
      if: matrix.language == 'go' && matrix.build-mode == 'manual'
      working-directory: go
      env:
        CGO_ENABLED: '1'
      # Rebuild cached packages so CodeQL can observe their compilation.
      run: go build -a ./...

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.2
      with:
        category: "/language:${{matrix.language}}/quality"
