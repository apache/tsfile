name: Build native package artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare package versions
    runs-on: ubuntu-24.04
    outputs:
      base_version: ${{ steps.versions.outputs.base_version }}
      logical_version: ${{ steps.versions.outputs.logical_version }}
      deb_version: ${{ steps.versions.outputs.deb_version }}
      rpm_version: ${{ steps.versions.outputs.rpm_version }}
      rpm_release: ${{ steps.versions.outputs.rpm_release }}
      archive_version: ${{ steps.versions.outputs.archive_version }}
      homebrew_version: ${{ steps.versions.outputs.homebrew_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate package versions
        id: versions
        run: |
          python3 packaging/scripts/native_package_versions.py \
            --cmake-file cpp/CMakeLists.txt \
            --build-date "$(date -u +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --git-sha "${{ github.sha }}" \
            --json-out versions.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload package versions
        uses: actions/upload-artifact@v7
        with:
          name: native-package-versions
          path: versions.json
          if-no-files-found: error
          retention-days: 14

  build-deb:
    name: Build Ubuntu 22.04 DEB packages
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install DEB build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            dpkg-dev \
            uuid-dev

      - name: Configure and build
        env:
          TSFILE_ARCHIVE_VERSION: ${{ needs.prepare.outputs.archive_version }}
          TSFILE_DEBIAN_PACKAGE_VERSION: ${{ needs.prepare.outputs.deb_version }}
        run: |
          cmake -S cpp -B build/deb -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=OFF \
            -DBUILD_TOOLS=ON \
            -DTSFILE_ENABLE_CPACK=ON \
            -DTSFILE_DEPENDENCY_SOURCE=AUTO \
            -DTSFILE_ENABLE_NATIVE_ARCH=OFF \
            -DTSFILE_ARCHIVE_VERSION="$TSFILE_ARCHIVE_VERSION" \
            -DTSFILE_DEBIAN_PACKAGE_VERSION="$TSFILE_DEBIAN_PACKAGE_VERSION"
          cmake --build build/deb --parallel

      - name: Build and verify DEB packages
        env:
          EXPECTED_DEB_VERSION: ${{ needs.prepare.outputs.deb_version }}
        shell: bash
        run: |
          mkdir -p packages
          cpack -G DEB --config build/deb/CPackConfig.cmake -B packages

          mapfile -t packages < <(find packages -maxdepth 1 -type f -name '*.deb' -print | sort)
          if [[ ${#packages[@]} -ne 3 ]]; then
            printf 'Expected exactly 3 DEB packages, found %s\n' "${#packages[@]}"
            exit 1
          fi

          actual_names="$({
            for package in "${packages[@]}"; do
              dpkg-deb --field "$package" Package
            done
          } | sort)"
          expected_names="$(printf '%s\n' tsfile tsfile-dev tsfile-tools | sort)"
          if [[ "$actual_names" != "$expected_names" ]]; then
            printf 'Unexpected DEB package names:\n%s\n' "$actual_names"
            exit 1
          fi

          for package in "${packages[@]}"; do
            package_version="$(dpkg-deb --field "$package" Version)"
            if [[ "$package_version" != "$EXPECTED_DEB_VERSION" ]]; then
              printf '%s has version %s, expected %s\n' \
                "$package" "$package_version" "$EXPECTED_DEB_VERSION"
              exit 1
            fi
          done

      - name: Upload DEB packages
        uses: actions/upload-artifact@v7
        with:
          name: native-deb-ubuntu22.04-amd64
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14

  test-deb:
    name: Test DEB packages on ${{ matrix.container }}
    needs: build-deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container:
          - ubuntu:22.04
          - ubuntu:24.04
    container: ${{ matrix.container }}
    steps:
      - name: Download DEB packages
        uses: actions/download-artifact@v8
        with:
          name: native-deb-ubuntu22.04-amd64
          path: packages

      - name: Install DEB packages
        shell: bash
        run: |
          apt-get update
          apt-get install -y ./packages/*.deb cmake build-essential

      - name: Verify installed DEB packages
        shell: bash
        run: |
          cli_path="$(command -v tsfile-cli)"
          cli_path="$(readlink -f -- "$cli_path")"
          cli_owner="$(dpkg-query -S "$cli_path")"
          cli_owner="${cli_owner%%:*}"
          if [[ "$cli_owner" != "tsfile-tools" ]]; then
            printf '%s is owned by %s, expected tsfile-tools\n' "$cli_path" "$cli_owner"
            exit 1
          fi
          tsfile-cli --version
          dpkg-query -W tsfile tsfile-dev tsfile-tools

      - name: Build and run an installed-package consumer
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.11)
          project(TsFileInstalledConsumer LANGUAGES CXX)

          find_package(TsFile CONFIG REQUIRED)
          add_executable(installed_consumer main.cpp)
          target_link_libraries(installed_consumer PRIVATE TsFile::tsfile)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <tsfile/cwrapper/tsfile_cwrapper.h>

          int main() {
            return TS_DATATYPE_INT32 == 1 ? 0 : 1;
          }
          CPP
          cmake -S consumer -B consumer/build
          cmake --build consumer/build --parallel
          ./consumer/build/installed_consumer

  build-rpm:
    name: Build AlmaLinux 9 RPM packages
    needs: prepare
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 30
    steps:
      - name: Install RPM build prerequisites
        run: |
          dnf install -y \
            cmake \
            gcc-c++ \
            ninja-build \
            pkgconf-pkg-config \
            rpm-build \
            git \
            curl \
            tar \
            gzip \
            libuuid-devel

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure and build
        env:
          TSFILE_ARCHIVE_VERSION: ${{ needs.prepare.outputs.archive_version }}
          TSFILE_RPM_PACKAGE_VERSION: ${{ needs.prepare.outputs.rpm_version }}
          TSFILE_RPM_PACKAGE_RELEASE: ${{ needs.prepare.outputs.rpm_release }}
        shell: bash
        run: |
          cmake -S cpp -B build/rpm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=OFF \
            -DBUILD_TOOLS=ON \
            -DTSFILE_ENABLE_CPACK=ON \
            -DTSFILE_DEPENDENCY_SOURCE=AUTO \
            -DTSFILE_ENABLE_NATIVE_ARCH=OFF \
            -DTSFILE_ARCHIVE_VERSION="$TSFILE_ARCHIVE_VERSION" \
            -DTSFILE_RPM_PACKAGE_VERSION="$TSFILE_RPM_PACKAGE_VERSION" \
            -DTSFILE_RPM_PACKAGE_RELEASE="$TSFILE_RPM_PACKAGE_RELEASE"
          cmake --build build/rpm --parallel

      - name: Build and verify RPM packages
        env:
          EXPECTED_RPM_VERSION: ${{ needs.prepare.outputs.rpm_version }}
          EXPECTED_RPM_RELEASE: ${{ needs.prepare.outputs.rpm_release }}
        shell: bash
        run: |
          mkdir -p packages
          cpack -G RPM --config build/rpm/CPackConfig.cmake -B packages

          mapfile -t packages < <(find packages -maxdepth 1 -type f -name '*.rpm' -print | sort)
          if [[ ${#packages[@]} -ne 3 ]]; then
            printf 'Expected exactly 3 RPM packages, found %s\n' "${#packages[@]}"
            exit 1
          fi

          actual_names="$({
            for package in "${packages[@]}"; do
              rpm -qp --queryformat '%{NAME}\n' "$package"
            done
          } | sort)"
          expected_names="$(printf '%s\n' tsfile tsfile-devel tsfile-tools | sort)"
          if [[ "$actual_names" != "$expected_names" ]]; then
            printf 'Unexpected RPM package names:\n%s\n' "$actual_names"
            exit 1
          fi

          for package in "${packages[@]}"; do
            package_version="$(rpm -qp --queryformat '%{VERSION}' "$package")"
            package_release="$(rpm -qp --queryformat '%{RELEASE}' "$package")"
            if [[ "$package_version" != "$EXPECTED_RPM_VERSION" ]]; then
              printf '%s has version %s, expected %s\n' \
                "$package" "$package_version" "$EXPECTED_RPM_VERSION"
              exit 1
            fi
            if [[ "$package_release" != "$EXPECTED_RPM_RELEASE" ]]; then
              printf '%s has release %s, expected %s\n' \
                "$package" "$package_release" "$EXPECTED_RPM_RELEASE"
              exit 1
            fi
          done

      - name: Upload RPM packages
        uses: actions/upload-artifact@v7
        with:
          name: native-rpm-almalinux9-x86_64
          path: packages/*.rpm
          if-no-files-found: error
          retention-days: 14

  test-rpm:
    name: Test RPM packages on AlmaLinux 9
    needs: build-rpm
    runs-on: ubuntu-24.04
    container: almalinux:9
    steps:
      - name: Download RPM packages
        uses: actions/download-artifact@v8
        with:
          name: native-rpm-almalinux9-x86_64
          path: packages

      - name: Install RPM packages
        run: dnf install -y packages/*.rpm cmake gcc-c++

      - name: Verify installed RPM packages
        shell: bash
        run: |
          cli_path="$(command -v tsfile-cli)"
          cli_path="$(readlink -f -- "$cli_path")"
          cli_owner="$(rpm -qf --queryformat '%{NAME}' "$cli_path")"
          if [[ "$cli_owner" != "tsfile-tools" ]]; then
            printf '%s is owned by %s, expected tsfile-tools\n' "$cli_path" "$cli_owner"
            exit 1
          fi
          tsfile-cli --version
          rpm -q tsfile tsfile-devel tsfile-tools

      - name: Build and run an installed-package consumer
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.11)
          project(TsFileInstalledConsumer LANGUAGES CXX)

          find_package(TsFile CONFIG REQUIRED)
          add_executable(installed_consumer main.cpp)
          target_link_libraries(installed_consumer PRIVATE TsFile::tsfile)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <tsfile/cwrapper/tsfile_cwrapper.h>

          int main() {
            return TS_DATATYPE_INT32 == 1 ? 0 : 1;
          }
          CPP
          cmake -S consumer -B consumer/build
          cmake --build consumer/build --parallel
          ./consumer/build/installed_consumer

  build-windows:
    name: Build Windows MSVC x86_64 ZIP
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure, build, and stage
        env:
          TSFILE_ARCHIVE_VERSION: ${{ needs.prepare.outputs.archive_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S cpp -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TEST=OFF `
            -DBUILD_TOOLS=ON `
            -DTSFILE_ENABLE_CPACK=ON `
            -DTSFILE_DEPENDENCY_SOURCE=BUNDLED `
            -DTSFILE_ENABLE_NATIVE_ARCH=OFF `
            -DTSFILE_ARCHIVE_VERSION="$env:TSFILE_ARCHIVE_VERSION"
          cmake --build build/windows --config Release --parallel
          cmake --install build/windows --config Release --prefix stage/windows

      - name: Test staged CLI and SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = (Resolve-Path stage/windows).Path
          $requiredPaths = @(
            "$stage/bin/tsfile-cli.exe"
            "$stage/bin/tsfile.dll"
            "$stage/lib/tsfile.lib"
            "$stage/include/tsfile/cwrapper/tsfile_cwrapper.h"
            "$stage/lib/cmake/TsFile/TsFileConfig.cmake"
            "$stage/share/doc/tsfile/LICENSE"
            "$stage/share/doc/tsfile/NOTICE"
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required staged file is absent: $path"
            }
          }

          $env:PATH = "$stage/bin;$env:PATH"
          tsfile-cli.exe --version

          New-Item -ItemType Directory -Path consumer -Force | Out-Null
          @'
          cmake_minimum_required(VERSION 3.11)
          project(TsFileInstalledConsumer LANGUAGES CXX)

          find_package(TsFile CONFIG REQUIRED)
          add_executable(installed_consumer main.cpp)
          target_link_libraries(installed_consumer PRIVATE TsFile::tsfile)
          '@ | Set-Content -Path consumer/CMakeLists.txt
          @'
          #include <tsfile/cwrapper/tsfile_cwrapper.h>

          int main() {
            return TS_DATATYPE_INT32 == 1 ? 0 : 1;
          }
          '@ | Set-Content -Path consumer/main.cpp
          cmake -S consumer -B consumer/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$stage"
          cmake --build consumer/build --config Release --parallel
          & consumer/build/Release/installed_consumer.exe

      - name: Build and inspect combined ZIP
        env:
          TSFILE_ARCHIVE_VERSION: ${{ needs.prepare.outputs.archive_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cpackConfig = Get-Content build/windows/CPackConfig.cmake -Raw
          if ($cpackConfig -notmatch 'set\(CPACK_ARCHIVE_COMPONENT_INSTALL "OFF"\)') {
            throw 'CPACK_ARCHIVE_COMPONENT_INSTALL must remain disabled'
          }

          New-Item -ItemType Directory -Path packages -Force | Out-Null
          cpack -G ZIP -C Release --config build/windows/CPackConfig.cmake -B packages `
            -D "CPACK_PACKAGE_VERSION=$env:TSFILE_ARCHIVE_VERSION"

          $archives = @(Get-ChildItem -Path packages -Filter *.zip -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one combined ZIP, found $($archives.Count)"
          }
          $expectedName = "tsfile-$env:TSFILE_ARCHIVE_VERSION-windows-x86_64.zip"
          if ($archives[0].Name -cne $expectedName) {
            throw "Unexpected ZIP name '$($archives[0].Name)'; expected '$expectedName'"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archives[0].FullName)
          try {
            $entryPaths = @($archive.Entries | ForEach-Object {
              $_.FullName.Replace('\', '/')
            })
            $requiredSuffixes = @(
              'bin/tsfile-cli.exe'
              'bin/tsfile.dll'
              'lib/tsfile.lib'
              'include/tsfile/cwrapper/tsfile_cwrapper.h'
            )
            foreach ($suffix in $requiredSuffixes) {
              $match = $entryPaths | Where-Object {
                $_.EndsWith($suffix, [System.StringComparison]::Ordinal)
              }
              if (-not $match) {
                throw "ZIP is missing a path ending in '$suffix'"
              }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-msvc-x86_64
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 14

  build-homebrew:
    name: Build Homebrew bottle on ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      TSFILE_HOMEBREW_VERSION: ${{ needs.prepare.outputs.homebrew_version }}
      SOURCE_REPOSITORY: ColinLeeo/tsfile
      SOURCE_GIT_SHA: ${{ github.sha }}
      BOTTLE_ROOT_URL: https://packages.apache.org/artifactory/tsfile/homebrew/dev/versions/${{ needs.prepare.outputs.homebrew_version }}/bottles
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Render immutable source Formula in a temporary local tap
        shell: bash
        run: |
          mkdir -p homebrew/Formula homebrew/bottles
          curl --fail --location --retry 3 \
            "https://github.com/$SOURCE_REPOSITORY/archive/$SOURCE_GIT_SHA.tar.gz" \
            --output "$RUNNER_TEMP/tsfile-source.tar.gz"
          source_sha256="$(shasum -a 256 "$RUNNER_TEMP/tsfile-source.tar.gz" | awk '{print $1}')"
          python3 packaging/scripts/render_homebrew_formula.py \
            --template packaging/homebrew/tsfile-dev.rb.in \
            --repository "$SOURCE_REPOSITORY" \
            --git-sha "$SOURCE_GIT_SHA" \
            --version "$TSFILE_HOMEBREW_VERSION" \
            --source-sha256 "$source_sha256" \
            --output homebrew/Formula/tsfile-dev.rb
          ruby -c homebrew/Formula/tsfile-dev.rb
          brew tap-new apache/tsfile-dev
          tap_path="$(brew --repository apache/tsfile-dev)"
          cp homebrew/Formula/tsfile-dev.rb "$tap_path/Formula/tsfile-dev.rb"

      - name: Build, test, and bottle the development Formula
        shell: bash
        run: |
          brew install --build-bottle apache/tsfile-dev/tsfile-dev
          brew test apache/tsfile-dev/tsfile-dev
          cd homebrew/bottles
          brew bottle --json --root-url "$BOTTLE_ROOT_URL" apache/tsfile-dev/tsfile-dev
          shopt -s nullglob
          bottles=(*.bottle*.tar.gz)
          metadata=(*.bottle.json)
          [[ ${#bottles[@]} -eq 1 && ${#metadata[@]} -eq 1 ]]

      - name: Upload platform Homebrew bottle and source Formula
        uses: actions/upload-artifact@v7
        with:
          name: native-homebrew-${{ matrix.name }}
          path: homebrew/
          if-no-files-found: error
          retention-days: 14

  merge-homebrew:
    name: Merge Homebrew development bottles
    needs: [prepare, build-homebrew]
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TSFILE_HOMEBREW_VERSION: ${{ needs.prepare.outputs.homebrew_version }}
      BOTTLE_ROOT_URL: https://packages.apache.org/artifactory/tsfile/homebrew/dev/versions/${{ needs.prepare.outputs.homebrew_version }}/bottles
    steps:
      - name: Download both platform Homebrew artifacts separately
        uses: actions/download-artifact@v8
        with:
          pattern: native-homebrew-macos-*
          path: homebrew-intermediate
          merge-multiple: false

      - name: Recreate the same pre-bottle Formula and collect metadata
        shell: bash
        run: |
          arm=homebrew-intermediate/native-homebrew-macos-arm64
          intel=homebrew-intermediate/native-homebrew-macos-x86_64
          cmp "$arm/Formula/tsfile-dev.rb" "$intel/Formula/tsfile-dev.rb"
          brew tap-new apache/tsfile-dev
          tap_path="$(brew --repository apache/tsfile-dev)"
          cp "$arm/Formula/tsfile-dev.rb" "$tap_path/Formula/tsfile-dev.rb"
          mkdir -p homebrew/Formula homebrew/bottles
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          destination = Path("homebrew/bottles")
          tags = set()
          for platform in ("macos-arm64", "macos-x86_64"):
              directory = Path("homebrew-intermediate") / f"native-homebrew-{platform}" / "bottles"
              metadata = list(directory.glob("*.bottle.json"))
              assert len(metadata) == 1, f"Expected one JSON for {platform}"
              data = json.loads(metadata[0].read_text())
              assert list(data) == ["apache/tsfile-dev/tsfile-dev"]
              entry = data["apache/tsfile-dev/tsfile-dev"]
              assert entry["formula"]["pkg_version"] == os.environ["TSFILE_HOMEBREW_VERSION"]
              assert entry["formula"]["path"] == "Library/Taps/apache/homebrew-tsfile-dev/Formula/tsfile-dev.rb"
              assert entry["bottle"]["root_url"] == os.environ["BOTTLE_ROOT_URL"]
              assert len(entry["bottle"]["tags"]) == 1
              tag, bottle = next(iter(entry["bottle"]["tags"].items()))
              assert (platform == "macos-arm64") == tag.startswith("arm64_")
              assert tag not in tags, f"Duplicate bottle tag: {tag}"
              tags.add(tag)
              local_name = bottle["local_filename"]
              assert Path(local_name).name == local_name
              source = directory / local_name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == bottle["sha256"]
              for source in (source, metadata[0]):
                  target = destination / source.name
                  assert not target.exists(), f"Duplicate artifact: {target}"
                  shutil.copy2(source, target)
          assert len(tags) == 2
          PY

      - name: Merge both bottle tags into the Formula
        shell: bash
        run: |
          brew bottle --merge --write --no-commit homebrew/bottles/*.json
          tap_path="$(brew --repository apache/tsfile-dev)"
          cp "$tap_path/Formula/tsfile-dev.rb" homebrew/Formula/tsfile-dev.rb
          ruby -c homebrew/Formula/tsfile-dev.rb

      - name: Verify merged Formula and normalize HTTP bottle filenames
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import unquote

          formula = Path("homebrew/Formula/tsfile-dev.rb").read_text()
          assert not re.search(r"@[A-Z0-9_]+@", formula), "Unresolved Formula token"
          assert len(re.findall(r"^\s*bottle\s+do\b", formula, re.M)) == 1
          assert f'root_url "{os.environ["BOTTLE_ROOT_URL"]}"' in formula
          directory = Path("homebrew/bottles")
          metadata = list(directory.glob("*.bottle.json"))
          assert len(metadata) == 2
          tags = set()
          for path in metadata:
              data = json.loads(path.read_text())
              entry = data["apache/tsfile-dev/tsfile-dev"]
              for tag, bottle in entry["bottle"]["tags"].items():
                  assert tag not in tags, f"Duplicate bottle tag: {tag}"
                  tags.add(tag)
                  assert re.search(rf'\b{re.escape(tag)}:\s*"{bottle["sha256"]}"', formula)
                  # Homebrew emits a double-dash local name but serves a single-dash URL.
                  filename = unquote(bottle["filename"])
                  assert Path(filename).name == filename and filename.endswith(".tar.gz")
                  source = directory / bottle["local_filename"]
                  target = directory / filename
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == bottle["sha256"]
                  if source != target:
                      assert not target.exists(), f"Duplicate HTTP bottle name: {filename}"
                      source.rename(target)
                  bottle["local_filename"] = filename
              path.write_text(json.dumps(data, indent=2) + "\n")
          assert len(tags) == 2
          assert len(list(directory.glob("*.tar.gz"))) == 2
          PY

      - name: Upload merged Homebrew Formula and bottles
        uses: actions/upload-artifact@v7
        with:
          name: native-homebrew
          path: homebrew/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble checksummed native package bundle
    needs: [prepare, test-deb, test-rpm, merge-homebrew, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download package versions
        uses: actions/download-artifact@v8
        with:
          name: native-package-versions
          path: versions

      - name: Download DEB packages
        uses: actions/download-artifact@v8
        with:
          name: native-deb-ubuntu22.04-amd64
          path: input/deb

      - name: Download RPM packages
        uses: actions/download-artifact@v8
        with:
          name: native-rpm-almalinux9-x86_64
          path: input/rpm

      - name: Download Homebrew Formula and bottles
        uses: actions/download-artifact@v8
        with:
          name: native-homebrew
          path: input/homebrew

      - name: Download Windows ZIP
        uses: actions/download-artifact@v8
        with:
          name: native-windows-msvc-x86_64
          path: input/windows

      - name: Assemble the publishable bundle
        env:
          LOGICAL_VERSION: ${{ needs.prepare.outputs.logical_version }}
        shell: bash
        run: |
          python3 packaging/scripts/assemble_native_packages.py \
            --input-dir input \
            --output-dir "tsfile-native-packages-$LOGICAL_VERSION" \
            --versions-json versions/versions.json \
            --source-repository "${{ github.repository }}" \
            --source-commit "${{ github.sha }}"

      - name: Verify assembled manifest checksums
        env:
          LOGICAL_VERSION: ${{ needs.prepare.outputs.logical_version }}
        shell: bash
        run: |
          python3 packaging/scripts/assemble_native_packages.py \
            --verify-bundle "tsfile-native-packages-$LOGICAL_VERSION"

      - name: Upload checksummed native package bundle
        uses: actions/upload-artifact@v7
        with:
          name: tsfile-native-packages-${{ needs.prepare.outputs.archive_version }}
          path: tsfile-native-packages-${{ needs.prepare.outputs.logical_version }}/
          if-no-files-found: error
          retention-days: 14
