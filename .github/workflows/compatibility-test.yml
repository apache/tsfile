name: Compatibility-Test

on:
  push:
    branches:
      - develop
      - iotdb
      - rc/*
    paths:
      - '.github/workflows/compatibility-test.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
      # The binary-format surface: the Java/C++ sources that define how data
      # is encoded, compressed, and laid out on disk, plus the module POMs
      # that select/version the compression dependencies, and the compatibility
      # harness itself.  Unrelated test/example/tool/doc changes are excluded
      # so a routine PR does not pay the ~30 minute cross-language matrix.
      - 'compat/**'
      - 'java/common/src/main/**'
      - 'java/tsfile/src/main/**'
      - 'java/pom.xml'
      - 'java/common/pom.xml'
      - 'java/tsfile/pom.xml'
      - 'java/tsfile/src/test/java/org/apache/tsfile/compatibility/**'
      - 'cpp/src/**'
      - 'cpp/CMakeLists.txt'
      - 'cpp/cmake/**'
      - 'cpp/third_party/**'
      - 'cpp/test/reader/table_view/encoding_compression_compatibility_test.cc'
  pull_request:
    branches:
      - develop
      - dev/*
      - iotdb
      - rc/*
    paths:
      - '.github/workflows/compatibility-test.yml'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
      # The binary-format surface: the Java/C++ sources that define how data
      # is encoded, compressed, and laid out on disk, plus the module POMs
      # that select/version the compression dependencies, and the compatibility
      # harness itself.  Unrelated test/example/tool/doc changes are excluded
      # so a routine PR does not pay the ~30 minute cross-language matrix.
      - 'compat/**'
      - 'java/common/src/main/**'
      - 'java/tsfile/src/main/**'
      - 'java/pom.xml'
      - 'java/common/pom.xml'
      - 'java/tsfile/pom.xml'
      - 'java/tsfile/src/test/java/org/apache/tsfile/compatibility/**'
      - 'cpp/src/**'
      - 'cpp/CMakeLists.txt'
      - 'cpp/cmake/**'
      - 'cpp/third_party/**'
      - 'cpp/test/reader/table_view/encoding_compression_compatibility_test.cc'
  workflow_dispatch:
    inputs:
      forceUpdates:
        description: "Forces a snapshot update"
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

jobs:
  generate-fixtures:
    name: Generate ${{ matrix.language }} fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [ java, cpp ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: corretto
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Cache verified C++ dependency archives
        if: matrix.language == 'cpp'
        uses: actions/cache@v6
        with:
          path: cpp/target/dependency-cache
          key: ${{ runner.os }}-tsfile-cpp-deps-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/cmake/*Source.cmake', 'cpp/third_party/CMakeLists.txt') }}

      - name: Generate Java compatibility fixtures
        if: matrix.language == 'java'
        shell: bash
        run: |
          mkdir -p compat-fixtures/java
          ./mvnw -P with-java \
            -Dtest=EncodingCompressionCompatibilityTest#generateFixtures \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtsfile.compat.spec="$PWD/compat/compatibility-matrix.csv" \
            -Dtsfile.compat.generate.dir="$PWD/compat-fixtures/java" \
            test

      - name: Publish Java generation summary
        if: matrix.language == 'java' && always()
        shell: bash
        run: |
          if [ -f compat-fixtures/java/summary.md ]; then
            cat compat-fixtures/java/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build C++ tests
        if: matrix.language == 'cpp'
        shell: bash
        run: |
          ./mvnw -P with-cpp \
            -Dbuild.type=Release \
            -DskipTests \
            -Dspotless.skip=true \
            -Dtsfile.dependency.source=BUNDLED \
            -Denable.antlr4=OFF \
            -Denable.snappy=ON \
            -Denable.lz4=ON \
            -Denable.lzokay=OFF \
            -Denable.zlib=ON \
            -Denable.zstd=ON \
            -Denable.lzma2=ON \
            -Denable.simd=OFF \
            package

      - name: Generate C++ compatibility fixtures
        if: matrix.language == 'cpp'
        shell: bash
        run: |
          mkdir -p compat-fixtures/cpp
          TSFILE_COMPAT_SPEC="$PWD/compat/compatibility-matrix.csv" \
          TSFILE_COMPAT_GENERATE_DIR="$PWD/compat-fixtures/cpp" \
            ./cpp/target/build/test/lib/TsFile_Test \
            --gtest_filter=EncodingCompressionCompatibilityTest.GenerateFixtures

      - name: Publish C++ generation summary
        if: matrix.language == 'cpp' && always()
        shell: bash
        run: |
          if [ -f compat-fixtures/cpp/summary.md ]; then
            cat compat-fixtures/cpp/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ${{ matrix.language }} fixtures
        uses: actions/upload-artifact@v7
        with:
          name: tsfile-${{ matrix.language }}-compat-fixtures
          path: compat-fixtures/${{ matrix.language }}/
          if-no-files-found: error
          retention-days: 1

  validate-fixtures:
    name: Validate ${{ matrix.writer }} fixtures with ${{ matrix.reader }}
    needs: generate-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - writer: java
            reader: cpp
          - writer: cpp
            reader: java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: corretto
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Cache verified C++ dependency archives
        if: matrix.reader == 'cpp'
        uses: actions/cache@v6
        with:
          path: cpp/target/dependency-cache
          key: ${{ runner.os }}-tsfile-cpp-deps-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/cmake/*Source.cmake', 'cpp/third_party/CMakeLists.txt') }}

      - name: Download ${{ matrix.writer }} fixtures
        uses: actions/download-artifact@v8
        with:
          name: tsfile-${{ matrix.writer }}-compat-fixtures
          path: compat-fixtures/${{ matrix.writer }}

      - name: Validate ${{ matrix.writer }} fixtures with Java
        if: matrix.reader == 'java'
        shell: bash
        run: |
          ./mvnw -P with-java \
            -Dtest=EncodingCompressionCompatibilityTest#validateFixtures \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtsfile.compat.spec="$PWD/compat/compatibility-matrix.csv" \
            -Dtsfile.compat.validate.dir="$PWD/compat-fixtures/${{ matrix.writer }}" \
            test

      - name: Publish Java validation summary
        if: matrix.reader == 'java' && always()
        shell: bash
        run: |
          if [ -f compat-fixtures/${{ matrix.writer }}/summary.md.validate ]; then
            cat compat-fixtures/${{ matrix.writer }}/summary.md.validate >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build C++ tests
        if: matrix.reader == 'cpp'
        shell: bash
        run: |
          ./mvnw -P with-cpp \
            -Dbuild.type=Release \
            -DskipTests \
            -Dspotless.skip=true \
            -Dtsfile.dependency.source=BUNDLED \
            -Denable.antlr4=OFF \
            -Denable.snappy=ON \
            -Denable.lz4=ON \
            -Denable.lzokay=OFF \
            -Denable.zlib=ON \
            -Denable.zstd=ON \
            -Denable.lzma2=ON \
            -Denable.simd=OFF \
            package

      - name: Validate ${{ matrix.writer }} fixtures with C++
        if: matrix.reader == 'cpp'
        shell: bash
        run: |
          TSFILE_COMPAT_SPEC="$PWD/compat/compatibility-matrix.csv" \
          TSFILE_COMPAT_VALIDATE_DIR="$PWD/compat-fixtures/${{ matrix.writer }}" \
            ./cpp/target/build/test/lib/TsFile_Test \
            --gtest_filter=EncodingCompressionCompatibilityTest.ValidateFixtures

      - name: Publish C++ validation summary
        if: matrix.reader == 'cpp' && always()
        shell: bash
        run: |
          if [ -f compat-fixtures/${{ matrix.writer }}/summary.md.validate ]; then
            cat compat-fixtures/${{ matrix.writer }}/summary.md.validate >> "$GITHUB_STEP_SUMMARY"
          fi
