name: Feature request
description: 提出一个新功能或能力
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 解决什么问题、当前为什么做不到。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 希望新增什么能力、对外表现如何。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 可验证的完成标准（尽量可执行）。
  - type: dropdown
    id: model
    attributes:
      label: 写入模型
      description: 该功能面向哪种写入模型。
      options:
        - 表模型（table）
        - 树模型（tree）
        - 两者都要
    validations:
      required: true
