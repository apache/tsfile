name: Bug report
description: Report a defect or unexpected behavior
title: "bug: "
labels: [bug]
assignees: []
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Which language implementation this issue is about.
      multiple: true
      options:
        - Java
        - C++
        - Python
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal reproducible steps, ideally with minimal code or data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: TsFile version and build method.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, error messages, or anything you have already investigated.
