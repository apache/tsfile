name: Documentation
description: 文档缺失、错误或需要改进
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: 文档位置
      description: 文件路径或页面链接。
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题
      description: 缺失了什么、哪里写错了、期望改成什么。
    validations:
      required: true
