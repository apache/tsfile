schema_version: 1
last_verified: "2026-08-17"
policy_reference: references/source-policy.md
path_bases:
  policy_reference: skill_root
  local_fallbacks_and_authorities: tsfile_repository_root

skill_baseline:
  scope: current-source
  source_ref: develop
  maven_project_version: "2.3.2-SNAPSHOT"
  java_release: "17"
  cpp_sdk_version: "2.3.2.dev"
  python_package_version: "2.3.2.dev"

official_url_prefixes:
  - https://tsfile.apache.org/
  - https://github.com/apache/tsfile

release_sources:
  - id: apache-downloads-zh
    purpose: published_artifacts
    url: https://tsfile.apache.org/zh/Download/
    mutable: true
  - id: github-releases
    purpose: release_notes_and_tags
    url: https://github.com/apache/tsfile/releases
    mutable: true
  - id: source-develop
    purpose: active_development_source
    url: https://github.com/apache/tsfile/tree/develop
    version_scope: develop
    mutable: true

guide_roots:
  - id: user-guide-v2-zh
    locale: zh-CN
    version_scope: v2.x_latest_alias
    url: https://tsfile.apache.org/zh/UserGuide/latest/
    mutable: true
  - id: user-guide-v2-en
    locale: en
    version_scope: v2.x_latest_alias
    url: https://tsfile.apache.org/UserGuide/latest/
    mutable: true
concepts:
  - id: time-series-concepts-zh
    url: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/Navigating_Time_Series_Data.html
    version_scope: v2.x_latest_alias
    local_fallbacks:
      - docs/src/zh/UserGuide/latest/QuickStart/Navigating_Time_Series_Data.md
      - skills/tsfile/references/core-concepts.md
  - id: data-model-zh
    url: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/Data-Model.html
    version_scope: v2.x_latest_alias
    local_fallbacks:
      - docs/src/zh/UserGuide/latest/QuickStart/Data-Model.md
      - skills/tsfile/references/core-concepts.md

language_guides:
  java:
    quick_start: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/QuickStart.html
    interface: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/InterfaceDefinition/InterfaceDefinition-Java.html
    version_scope: v2.x_latest_alias
    local_authorities:
      - java/examples/src/main/java/org/apache/tsfile/v4/
      - java/tsfile/src/main/java/
      - skills/tsfile/references/java.md
  python:
    quick_start: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/QuickStart-PYTHON.html
    interface: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/InterfaceDefinition/InterfaceDefinition-Python.html
    version_scope: v2.x_latest_alias
    local_authorities:
      - python/examples/example.py
      - python/tsfile/
      - python/tests/
      - skills/tsfile/references/python.md
  cpp:
    quick_start: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/QuickStart-CPP.html
    interface: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/InterfaceDefinition/InterfaceDefinition-CPP.html
    version_scope: v2.x_latest_alias
    local_authorities:
      - cpp/examples/cpp_examples/
      - cpp/src/
      - skills/tsfile/references/cpp.md
  c:
    quick_start: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/QuickStart-C.html
    interface: https://tsfile.apache.org/zh/UserGuide/latest/QuickStart/InterfaceDefinition/InterfaceDefinition-C.html
    version_scope: v2.x_latest_alias
    local_authorities:
      - cpp/examples/c_examples/
      - cpp/src/cwrapper/tsfile_cwrapper.h
      - skills/tsfile/references/c.md

dataframe:
  guide_zh: https://tsfile.apache.org/zh/UserGuide/latest/DataFrame/TsFileDataFrame.html
  version_scope: v2.x_latest_alias
  local_authorities:
    - python/tsfile/utils.py
    - python/tsfile/dataset/
    - python/tsfile/tsfile_reader.pyx
    - python/tsfile/tsfile_writer.pyx
    - python/tsfile/tsfile_table_writer.py
    - python/tests/test_dataframe.py
    - python/tests/test_tsfile_dataset.py
    - python/tests/test_batch_arrow.py
    - python/tests/test_write_arrow.py
    - skills/tsfile/references/dataframe-arrow.md

current_capabilities:
  file_properties_and_tag_filters:
    local_authorities:
      - java/tsfile/src/main/java/org/apache/tsfile/read/filter/factory/TagFilterBuilder.java
      - java/tsfile/src/main/java/org/apache/tsfile/read/v4/ITsFileReader.java
      - java/tsfile/src/main/java/org/apache/tsfile/write/v4/ITsFileWriter.java
      - cpp/src/reader/filter/tag_filter.h
      - cpp/src/reader/tsfile_reader.h
      - cpp/src/writer/tsfile_writer.h
      - cpp/src/writer/tsfile_table_writer.h
      - cpp/src/cwrapper/tsfile_cwrapper.h
      - python/tsfile/tag_filter.py
      - python/tsfile/tsfile_reader.pyx
      - python/tsfile/tsfile_writer.pyx
      - python/tsfile/tsfile_table_writer.py
      - skills/tsfile/references/properties-filters.md
  cpp_build_and_parallel_write:
    local_authorities:
      - cpp/CMakeLists.txt
      - cpp/src/CMakeLists.txt
      - cpp/build.sh
      - cpp/src/common/global.h
      - cpp/src/common/global.cc
      - cpp/src/common/config/config.h
      - cpp/src/writer/tsfile_writer.cc
      - skills/tsfile/references/cpp-build-write.md
  encoding_and_compression_factories:
    local_authorities:
      - java/tsfile/src/main/java/org/apache/tsfile/file/metadata/enums/TSEncoding.java
      - java/tsfile/src/main/java/org/apache/tsfile/encoding/encoder/TSEncodingBuilder.java
      - java/tsfile/src/main/java/org/apache/tsfile/encoding/decoder/Decoder.java
      - java/tsfile/src/main/java/org/apache/tsfile/file/metadata/enums/CompressionType.java
      - java/tsfile/src/main/java/org/apache/tsfile/compress/ICompressor.java
      - java/tsfile/src/main/java/org/apache/tsfile/compress/IUnCompressor.java
      - cpp/src/encoding/encoder_factory.h
      - cpp/src/encoding/decoder_factory.h
      - cpp/src/compress/compressor_factory.h
      - cpp/src/common/db_common.h
      - skills/tsfile/references/encoding-compression.md
  advanced_apis:
    local_authorities:
      - cpp/src/reader/tsfile_reader.h
      - cpp/src/reader/tsfile_tree_reader.h
      - cpp/src/cwrapper/tsfile_cwrapper.h
      - python/tsfile/tsfile_reader.pyx
      - python/tsfile/schema.py
      - java/tsfile/src/main/java/org/apache/tsfile/write/v4/TableTsBlock2TsFileWriter.java
      - java/tsfile/src/main/java/org/apache/tsfile/write/record/Tablet.java
      - java/tsfile/src/main/java/org/apache/tsfile/read/TsFileSequenceReader.java
      - java/tsfile/src/main/java/org/apache/tsfile/read/reader/TsFileInput.java
      - java/tsfile/src/main/java/org/apache/tsfile/read/reader/BufferedTsFileInput.java
      - cpp/src/file/restorable_tsfile_io_writer.h
      - cpp/src/writer/tsfile_tree_writer.h
      - cpp/src/writer/tsfile_table_writer.h
      - java/common/src/main/java/org/apache/tsfile/utils/BitMap.java
      - skills/tsfile/references/advanced-apis.md

ecosystem:
  version_policy: verify_connector_dependencies_before_use
  flink: https://tsfile.apache.org/UserGuide/latest/Ecosystem-Integration/Flink-TsFile.html
  hive: https://tsfile.apache.org/UserGuide/latest/Ecosystem-Integration/Hive-TsFile.html
  spark: https://tsfile.apache.org/UserGuide/latest/Ecosystem-Integration/Spark-TsFile.html

tools:
  java:
    owner_skill:
      path: SKILL.md
      base: skill_root
    import:
      formats:
        - csv
        - parquet
        - arrow
      local_authorities:
        - java/tools/README.md
        - java/tools/src/main/java/org/apache/tsfile/tools/
        - java/tools/src/assembly/resources/tools/
        - skills/tsfile/references/java-tools.md
    table_point_count:
      local_authorities:
        - java/tools/README.md
        - java/tsfile/src/main/java/org/apache/tsfile/utils/TsFileTablePointCountTool.java
        - java/tools/src/assembly/resources/tools/tsfile-table-point-count.sh
        - java/tools/src/assembly/resources/tools/tsfile-table-point-count.bat
        - skills/tsfile/references/java-tools.md
  cpp_cli:
    owner_skill:
      path: ../tsfile-cli/SKILL.md
      base: skill_root
    cli: https://tsfile.apache.org/UserGuide/latest/Tools/Tsfile-CLI.html
    viewer: https://tsfile.apache.org/UserGuide/latest/Tools/Tsfile-Viewer.html
    local_authorities:
      - cpp/tools/README.md
      - cpp/tools/
